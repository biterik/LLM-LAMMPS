clusters:
  cmmg:
    aliases: [cmti]                       # cmfe partitions use cmti hardware
    ssh:
      user: <CLUSTER_USER>
      host: <CLUSTER_HOST>
    mount:
      local:  ~/cluster-mounts/cmmg/
      remote: /cmmc/ptmp/<CLUSTER_USER>/         # user ptmp; pilot scope ends here
      sshfs_options:                      # L15 — fixes stale-view problem
        - auto_cache                      # invalidates cache on mtime/size change (the load-bearing one)
        - attr_timeout=2
        - entry_timeout=2
        - negative_timeout=2
        - reconnect
        - ServerAliveInterval=30
      # NOTE: do NOT include `kernel_cache=no` — that's invalid syntax;
      # `kernel_cache` is a FUSE boolean flag, presence=on, absence=off.
      # Default already excludes the kernel buffer cache. (See L15.)
      command_example: >-
        sshfs <CLUSTER_USER>@<CLUSTER_HOST>:/cmmc/ptmp/<CLUSTER_USER>
        ~/cluster-mounts/cmmg
        -o auto_cache,attr_timeout=2,entry_timeout=2,negative_timeout=2,reconnect,ServerAliveInterval=30
    paths:
      ptmp:       /cmmc/ptmp/<CLUSTER_USER>
      potentials: /cmmc/ptmp/<CLUSTER_USER>/POTENTIALS    # mount-visible; pilot can verify
      home:       /home/<CLUSTER_USER>                    # reference-only; never written
    queue: slurm
    gpu: false
    # ---- HARDWARE / TOPOLOGY --------------------------------------------
    # Verified 2026-08-03 from `scontrol show partition p.cmmg|s.cmmg` and
    # `sinfo -p p.cmmg,s.cmmg -o "%P %a %D %c %z %C %l"` run on cmmg, plus
    # the MPCDF hardware table in
    # canon/local/reference/cluster-lammps-info-legacy.txt.
    hardware:
      nodes: "cmmg[001-096]"              # 96 compute nodes
      cpu: "2x AMD EPYC 9754, 128 cores per socket"
      topology_S_C_T: "2:128:2"           # sockets : cores/socket : threads/core
      physical_cores_per_node: 256        # <-- what --hint=nomultithread consumes
      logical_cpus_per_node: 512          # SMT 2. Slurm counts CPUs as LOGICAL.
      ram_per_node_GB: 768                # nameplate
      real_memory_per_node_MB: 730000     # what Slurm allocates (TRES
                                          # mem=68437.50G / 96 nodes).
                                          # Drives the s.cmmg task cap, L36.
      interconnect: "Mellanox InfiniBand NDR200, 200 Gb"
      total_cpus_across_partition: 49152  # 96 x 512 logical
      # cmti[001-360] is DIFFERENT hardware -- 2x Intel Xeon Gold 6230,
      # 20 cores/socket = 40 cores, 192 GB -- and backs the *.cmfe
      # partitions. Never size a cmfe job from cmmg core counts.
    partitions:
      - name: p.cmmg
        scope: "parallel and WHOLE-NODE jobs"
        nodes: "cmmg[001-096]"
        min_nodes: 1
        max_nodes: 96                     # up to 24576 physical cores
        oversubscribe: EXCLUSIVE          # whole nodes, allocated exclusively
        default_time: "1-00:00:00"        # 24 h
        max_time: "4-00:00:00"            # 96 h
        memory: "DefMemPerNode=UNLIMITED"
      - name: s.cmmg
        scope: "SUB-NODE jobs; nodes are SHARED between jobs"
        nodes: "cmmg[001-096]"
        min_nodes: 1
        max_nodes: 1                      # hard cap: one node, always
        oversubscribe: NO
        default_time: "1-00:00:00"        # 24 h
        max_time: "4-00:00:00"            # 96 h
        memory: "DefMemPerCPU=1500M"
        # L36: with --hint=nomultithread Slurm allocates WHOLE CORES, so
        # allocated CPUs = 2 x ntasks and the implied default request is
        # 2*ntasks*1500 MB. Cap without an explicit --mem:
        #   floor(730000/1500) = 486 CPUs = 243 tasks nomultithread.
        # 256 tasks needs `--mem=0`. Verified by sbatch --test-only
        # bisect 2026-08-03; the 243-task break-even was exact.
        max_nomultithread_tasks_without_mem_flag: 243
      - { name: p.cmfe, scope: ">1 node, cmti hardware (40 cores/node)" }
      - { name: s.cmfe, scope: "<=1 node, cmti hardware (40 cores/node)" }
    billing:
      tres_billing_weights: "CPU=0.43"
    # Partition selection rule:
    #  - more than one node -> p.cmmg. This one is hard: s.cmmg has
    #    MaxNodes=1.
    #  - 1-core baselines   -> s.cmmg (2026-05-29 walk).
    #  - Do NOT pass `-N` unless you mean it; the working large-cell scripts
    #    on this cluster set --ntasks only and let Slurm place them.
    #  - ONE WHOLE NODE IS ALLOWED ON s.cmmg (MaxNodes=1,
    #    MaxCPUsPerNode=UNLIMITED). The partition is NOT the constraint;
    #    the memory default is. On s.cmmg a nomultithread job is capped at
    #    243 tasks unless it passes `--mem=0` -- see L36. p.cmmg has no
    #    per-CPU memory default and is unaffected.
    #  - For a job whose PURPOSE is a timing measurement, prefer p.cmmg
    #    (OverSubscribe=EXCLUSIVE): no noisy neighbours on the node.
    #  - Validate any new resource request with `sbatch --test-only`
    #    BEFORE submitting. It reports placement and start time without
    #    queueing anything, and it costs nothing.
    # WALLTIME: default 24 h, MAXIMUM 96 h (4-00:00:00) on BOTH cmmg
    # partitions. Ask for what the job needs up to 96 h; unused walltime is
    # not billed (billing is TRES CPU-weighted, see `billing` above).
    modules:
      lammps:
        - lammps/241119
        - lammps/250722                   # observed default in Erik's examples
      # Per-module capability captures live in sibling files
      # (`lammps-capabilities-<cluster>-<version>.md`). For lammps/250722
      # see `canon/lammps-capabilities-cmmg-250722.md` — installed
      # packages, build flags, accelerator config, binary path,
      # style snippets. Refresh on module rebuild.
    sbatch_defaults:
      # get-user-env REMOVED 2026-08-02: this Slurm build rejects the
      # argument form at sbatch time (see quirk
      # sbatch_rejects_get_user_env_argument_form). Job-env determinism
      # comes from `module purge` + explicit `module load` (L11).
      hint: nomultithread
      mail-type: BEGIN,END,FAIL
      mail-user: <NOTIFY_EMAIL>
      output: "%x.out"
      error: "%x.err"
    occasional_overrides:
      reservation: Erik                   # only when Erik says "urgent"
    docs_url: "https://docs.mpcdf.mpg.de/doc/computing/clusters/systems/Sustainable_Materials.html"
    downtimes:
      pattern: "~every 4 months"
      typical_duration: 1d
    quirks:
      # L14 — files produced by cluster-side processes (slurm job outputs,
      # LAMMPS dumps, etc.) appear on the sshfs mount but cannot be
      # deleted via the mount (permission denied). Cleanup must go
      # through Erik's terminal (ssh in, or remote rm via ssh "...").
      # The mount is a read window for these files, not a duplicate.
      - cluster_created_files_undeletable_via_mount
      # L15 — sshfs mount needs auto_cache + short attr/entry timeouts
      # to avoid stale-view problem when jobs update files cluster-side.
      # See mount.sshfs_options above.
      # Write-side variant (2026-07-30): files just CREATED through the
      # mount may not appear in `ls` for some time, though they are
      # complete and readable by exact path (18 fresh .in/.slurm files
      # were readable with correct md5 while `ls` showed `total 0`).
      # Because rsync/find/globs enumerate via the directory listing,
      # they silently copy NOTHING and exit 0. Therefore:
      #   - verify writes with `stat`/`wc -c`/`md5sum` on the full
      #     path, never with `ls`;
      #   - never enumerate freshly written files with rsync/find/globs;
      #   - copy by explicit filename when mirroring a just-written
      #     run dir.
      # Quieter than the read-side variant: a stale read looks like
      # missing data and gets noticed; a stale write-listing looks like
      # a successful no-op.
      - sshfs_default_options_show_stale_views
      # Established 2026-07-28. This Slurm build rejects the argument
      # form `--get-user-env=L` at sbatch time ("sbatch: option
      # '--get-user-env' doesn't allow an argument"). Do not use
      # --get-user-env at all: job-env determinism comes from
      # `module purge` + explicit `module load` (L11). Bit on the two
      # thread-01 anchor submit scripts staged 2026-06-30 (rejected
      # before queueing; no queue slot lost).
      - sbatch_rejects_get_user_env_argument_form
      # Established 2026-05-31. The cmmg lammps modules are MPI-built
      # only (no lmp_serial). The binary calls MPI_Init() before
      # processing any flag, including `-h`, so a bare `lmp ...` on the
      # login node aborts with `PMI2_Job_GetId returned 14`. Rule:
      # ALL lmp invocations on cmmg go through sbatch, including
      # diagnostic / capability probes. `I_MPI_HYDRA_BOOTSTRAP=fork
      # mpirun -n 1 lmp -h` is a known login-node workaround but is
      # not the normal path — Erik prefers sbatch for everything.
      - lmp_invocations_require_sbatch_on_cmmg
      # Established 2026-05-31. Cluster-bound files (LAMMPS inputs,
      # submit scripts, anything an sbatch will read) must be written
      # directly via the cluster mount (~/cluster-mounts/cmmg/...),
      # not only to the Mac project tree with an rsync proposed
      # afterward. The mount IS the cluster filesystem. If the mount
      # is unavailable when needed, the pilot must complain (ask Erik
      # to mount it) instead of silently working on the Mac side and
      # deferring the push.
      - cluster_bound_files_write_via_mount
      # Established 2026-05-31, refined later same day. The reverse
      # direction: cluster-produced outputs are pulled to Mac, but
      # CURATED, not kitchen-sink. Keep-list (mirror to Mac): *.in,
      # *.slurm, *.py, *.dat, *.yaml, *.md, *.pdf, plots_*/ subdirs.
      # Noise-list (NEVER mirror): per-iteration LAMMPS *.log,
      # log.lammps, start_time.txt, end_time.txt, slurm *.err/*.out,
      # AppleDouble sidecars (._*, .DS_Store), __pycache__/.
      # Structures (.data, .data.zst, .dump): ASK BEFORE COPYING;
      # default no; if Erik approves, pull via zstd -19 per the
      # Thread-01 mile-pebble pattern. Helper script:
      # `canon/templates/mirror-cluster-to-mac-curated.sh` (rsync with
      # filter rules so noise can't sneak in).
      - important_outputs_mirrored_to_mac
      # SETTLED 2026-08-03 by an sbatch --test-only bisect (see L36).
      # s.cmmg DefMemPerCPU=1500 MB x (2 x ntasks) allocated CPUs under
      # --hint=nomultithread exceeds the node's RealMemory=730000 MB above
      # 243 tasks, and sbatch rejects it at submit time. Fix: --mem=0.
      # NOT a partition-scope issue: one whole node IS allowed on s.cmmg.
      - s_cmmg_defmempercpu_caps_nomultithread_tasks

  # ---------------------------------------------------------------------
  # Seeded 2026-07-28 from the LAMMPS-compile-n-bench repo (see
  # canon/tools/lammps-compile-n-bench.card.yaml), which holds the verified
  # build recipes, module stacks and benchmark numbers for these machines.
  # Structure only — real user/host/scratch come from
  # canon/local/clusters.local.yaml.
  # ---------------------------------------------------------------------

  raven:
    site: MPCDF
    ssh:
      user: <CLUSTER_USER>
      host: <RAVEN_HOST>
    paths:
      ptmp: /ptmp/<CLUSTER_USER>
      # WARNING: the $PTMP environment variable on raven points at the cmmc
      # scratch (a DIFFERENT machine) and is wrong here. Always use
      # /ptmp/$USER literally; never trust $PTMP on raven. Confirmed 2026-07-01.
      home: /u/<CLUSTER_USER>            # tight quota; dotfiles/config ONLY
    queue: slurm
    gpu: true
    hardware:
      gpu_nodes: "4x NVIDIA A100 40GB SXM (NVLink), Ampere"
      cpu_nodes: "2x Intel Xeon IceLake-SP Platinum 8360Y, 72 cores, AVX-512"
    modules:
      # Verified in build-lammps-raven.sh / build-lammps-raven-cpu.sh
      gpu_build: [gcc/13, cuda/12.6, openmpi_gpu/5.0, cmake]
      cpu_build: [mkl/2025.2]             # + icpx (oneAPI); gcc/13 pinned via
                                          # --gcc-toolchain for C++17 <filesystem>
      kokkos: { backend: CUDA, arch: AMPERE80, compiler: "nvcc_wrapper / g++13" }
    binaries:
      gpu: lmp_raven
      cpu: lmp_raven_cpu
    docs_url: "https://docs.mpcdf.mpg.de/doc/computing/raven-user-guide.html"
    downtimes: { pattern: "~fortnightly" }

  viper-gpu:
    site: MPCDF
    # ssh alias/shortname is machine-specific — see canon/local/clusters.local.yaml
    ssh:
      user: <CLUSTER_USER>
      host: <VIPER_GPU_HOST>
    paths:
      ptmp: /viper/ptmp2/<CLUSTER_USER>   # GPU-side scratch
      home: /u/<CLUSTER_USER>             # tight quota; dotfiles/config ONLY
    queue: slurm
    gpu: true
    hardware:
      note: "AMD Instinct MI300A APU (gfx942): 24 CPU cores + 1 GPU per APU,
             128 GB shared HBM3, unified host/device memory."
    modules:
      build: [gcc/14, rocm/6.3, openmpi_gpu/5.0, cmake]
      build_alt: [gcc/16, rocm/7.2, openmpi_gpu/5.0, cmake]
      kokkos: { backend: HIP, arch: AMD_GFX942_APU, compiler: hipcc }
    binaries: { gpu: lmp_viper }
    docs_url: "https://docs.mpcdf.mpg.de/doc/computing/viper-gpu-user-guide.html"
    downtimes: { pattern: "~fortnightly" }

  viper-cpu:
    site: MPCDF
    aliases: [viper]
    ssh:
      user: <CLUSTER_USER>
      host: <VIPER_CPU_HOST>
    paths:
      ptmp: /viper/ptmp1/<CLUSTER_USER>   # CPU-side scratch
      home: /u/<CLUSTER_USER>             # tight quota; dotfiles/config ONLY
    queue: slurm
    gpu: false
    hardware:
      cpu_nodes: "2x AMD EPYC 9554 Genoa, 128 Zen4 cores/node"
    modules:
      kokkos: { backend: OpenMP, arch: ZEN4, compiler: "g++ (-march=znver4)" }
    binaries: { cpu: lmp_viper_cpu }
    docs_url: "https://docs.mpcdf.mpg.de/doc/computing/viper-user-guide.html"
    downtimes: { pattern: "~fortnightly" }

  nhr_erlangen: { status: not-seeded }    # stability tbd

# ---------------------------------------------------------------------
# CROSS-CLUSTER HARD RULES (apply to every entry above)
#
# 1. NEVER install or download into cluster $HOME — quotas are tight and
#    pip/conda venvs, TensorFlow + nvidia-cu12 wheels, ML-potential model
#    caches and build trees are multi-GB. They WILL blow it ("Disk quota
#    exceeded" on cmmg, 2026-06-30, installing TF into ~/tf-cpu).
#    Put everything under the cluster's ptmp/scratch and redirect caches:
#    PIP_CACHE_DIR, TMPDIR and any model cache var point at scratch;
#    create venvs under scratch; use `pip --no-cache-dir`.
#    $HOME is for dotfiles and config only.
#
# 2. LAMMPS and any MPI code run ONLY inside a Slurm job, never on a login
#    node. The builds here are MPI-linked and abort in MPI_Init ->
#    PMI2_Job_GetId on a login node. Always propose sbatch/srun. The only
#    login-node exception is a non-simulation singleton smoke test such as
#    `lmp -h`, and even then clear PMI first:
#      unset I_MPI_PMI_LIBRARY; I_MPI_FABRICS=shm lmp -h
#    Login nodes are for building, downloading and submitting.
#
# 3. Scratch is NOT backed up and can be wiped at any time. Anything
#    expensive to regenerate gets mirrored (curated, compressed) to the
#    backed-up Mac before a thread is closed. See ARCHITECTURE.md §4.
# ---------------------------------------------------------------------
